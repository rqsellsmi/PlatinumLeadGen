name: CI

# Minimal pull-request / push quality gate (review item #57, decision D18 REVISED).
#
# Scope is deliberately the four checks that already pass on main:
#   npm ci -> typecheck -> vitest -> next build
#
# ESLint (#56), `npm audit` policy (#60) and Playwright/axe (#55) are the
# follow-on gate; they need a committed ESLint config and owner-side setup
# (browser binaries, a test database, secrets) that this workflow deliberately
# does not depend on. See docs/current-state.md.
#
# No repository secrets are required. `SKIP_ENV_VALIDATION=1` bypasses the env
# gate in lib/env.ts, and lib/db.ts connects lazily, so `next build` succeeds
# without DATABASE_URL. The `[queries] … fetch failed` lines the build prints
# offline are EXPECTED (lessons-learned §1) — public data loaders swallow DB
# errors and render empty. Do not "fix" them.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

# One run per ref; a new push supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKIP_ENV_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Production build
        run: npm run build
