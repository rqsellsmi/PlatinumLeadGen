name: Scheduled jobs

# SUPERSEDED — these four endpoints now run from Upstash QStash. This workflow is
# DISABLED in the Actions UI (Actions -> "Scheduled jobs" -> ... -> Disable) and kept
# only as a documented fallback. See docs/cron-migration-qstash.md.
#
# DO NOT RE-ENABLE while the QStash schedules are active. `expire-offers` has no
# concurrency guard: it selects offers with status='offered' and then writes each one
# with no status check on the update, so two schedulers firing seconds apart can both
# read the same offer and double-apply the score penalty AND double-reassign the lead.
#
# Why it was superseded: this ran `*/10` (144 runs/day expected) but GitHub services
# this repo's cron queue only every ~2-3 hours, so it actually fired ~13 times/day with
# gaps of 52-198 min, and some runs were cancelled with no runner ever assigned. That
# left `expire-offers` — which enforces the 3-hour acceptance window by sweep — up to
# 5-6h late, parking leads on non-responding agents. Public repos are on the free
# shared-runner pool, which GitHub throttles hardest. `idx-sync.yml` and
# `scheduled-daily.yml` stay on Actions: the former needs a long-running host that no
# HTTP scheduler can provide, and the latter's daily ticks all fire (just 2-3h late).
#
# Required repository secrets, if ever re-enabled (Settings -> Secrets and variables):
#   DEPLOY_URL   e.g. https://remax-platinumonline.com  (no trailing slash)
#   CRON_SECRET  the SAME value set as CRON_SECRET in your Vercel env vars

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch: {} # allow manual runs for testing

# Avoid overlapping runs if a previous one is still going.
concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  ping-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::DEPLOY_URL and CRON_SECRET repository secrets must be set."
            exit 1
          fi

      - name: Dispatch queued offers
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BASE="${DEPLOY_URL%/}"  # trim a trailing slash so we never hit //api/…
          curl -fsS --max-time 60 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$BASE/api/cron/dispatch-queued-offers"

      - name: Expire offers
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BASE="${DEPLOY_URL%/}"
          curl -fsS --max-time 60 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$BASE/api/cron/expire-offers"

      - name: Follow-up check
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BASE="${DEPLOY_URL%/}"
          curl -fsS --max-time 60 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$BASE/api/cron/followup-check"

      - name: Dispatch Google Ads conversions
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BASE="${DEPLOY_URL%/}"
          curl -fsS --max-time 60 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$BASE/api/cron/google-ads-dispatch"
